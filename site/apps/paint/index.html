<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>untitled - Paint</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="../_lib/win.css">
<link rel="stylesheet" href="paint.css">
<script src="../_lib/app.js"></script>
</head>
<body>
<div id="Menu"></div>
<div id="Main">
  <div id="ToolBox">
    <div class="tools" id="Tools"></div>
    <div class="opts" id="Opts"></div>
  </div>
  <div id="Area" class="w98-scroll">
    <div id="Stage">
      <canvas id="Img"></canvas>
      <canvas id="Over"></canvas>
      <canvas id="SelCanvas" hidden></canvas>
      <div id="SelBox" hidden></div>
      <textarea id="TextBox" hidden spellcheck="false"></textarea>
      <div class="grip" data-dir="e"></div><div class="grip" data-dir="s"></div><div class="grip" data-dir="se"></div>
      <div id="ResizeGhost" hidden></div>
    </div>
  </div>
</div>
<div id="ColorBox">
  <div id="Current" title="Current colors: click to swap"><div class="bgc"></div><div class="fgc"></div></div>
  <div id="Palette"></div>
</div>
<div class="statusbar" id="Status"><div id="Help">For Help, click Help Topics on the Help Menu.</div><div id="Coords"></div><div id="SizeInfo"></div></div>
<div id="FontBar" hidden>
  <div class="fb-title">Fonts</div>
  <div class="fb-row">
    <select id="FontFace"></select>
    <select id="FontSize"></select>
    <button class="fb-btn" id="FontB" title="Bold"><b>B</b></button><button class="fb-btn" id="FontI" title="Italic"><i>I</i></button><button class="fb-btn" id="FontU" title="Underline"><u>U</u></button>
  </div>
</div>
<input type="file" id="OpenIn" accept="image/*" hidden>
<script src="paint.js"></script>
</body>
</html>
