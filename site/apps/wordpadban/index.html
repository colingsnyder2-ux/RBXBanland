<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WordPadBan</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="../_lib/win.css"><style>
body{display:flex;flex-direction:column;background:#c0c0c0;overflow:hidden}.bar{display:flex;gap:4px;align-items:center;padding:3px 5px;background:#c0c0c0;border-bottom:1px solid #888}.bar select{height:21px}.tool{min-width:25px;height:23px;padding:1px 5px}.sep{width:1px;height:20px;background:#888;border-left:1px solid #fff}.wrap{flex:1;min-height:0;overflow:auto;padding:10px;background:#888}.page{min-height:100%;max-width:760px;margin:auto;padding:28px 36px;background:#fff;box-shadow:2px 2px #444;box-sizing:border-box;font:16px Arial,sans-serif;outline:0}.page:empty:before{content:'Start typing...';color:#aaa}.statusbar{padding:3px 7px;display:flex;justify-content:space-between;font:11px Arial}.statusbar span:last-child{font-family:"Courier New",monospace}.vapor #Page{background:#fff6ff}
</style><script src="../_lib/app.js"></script></head><body><div id="Menu"></div><div class="bar"><select id="Font" aria-label="Font"><option>Arial</option><option>Times New Roman</option><option>Courier New</option><option>Verdana</option></select><select id="Size" aria-label="Size"><option value="12">12</option><option value="16" selected>16</option><option value="20">20</option><option value="28">28</option></select><span class="sep"></span><button class="btn tool" data-cmd="bold"><b>B</b></button><button class="btn tool" data-cmd="italic"><i>I</i></button><button class="btn tool" data-cmd="underline"><u>U</u></button><span class="sep"></span><button class="btn tool" data-cmd="justifyLeft">≡</button><button class="btn tool" data-cmd="justifyCenter">≣</button><button class="btn tool" data-cmd="justifyRight">≡</button><button class="btn tool" data-cmd="insertUnorderedList">• List</button></div><div class="wrap"><article id="Page" class="page" contenteditable="true" spellcheck="true" aria-label="Document"></article></div><div class="statusbar"><span id="State">Ready</span><span id="Count">0 words · 0 chars</span></div><script src="wordpad.js"></script></body></html>
