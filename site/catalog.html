<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog - RBXBanland</title>
<link rel="stylesheet" href="css/site.css">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
</head>
<body>
<div id="Container">
  <header id="Header"></header>
  <main id="Main">
    <h2 class="PageTitle">Catalog</h2>
    <div class="Tabs" id="Tabs"></div>
    <div id="GamesContainer">
      <aside class="DisplayFilters">
        <h4>Show</h4>
        <ul id="Filters">
          <li><a href="#" data-f="all">Everything</a></li>
          <li><a href="#" data-f="tix">Tix items</a></li>
          <li><a href="#" data-f="robux">ROBUX items</a></li>
          <li><a href="#" data-f="free">Free!</a></li>
          <li><a href="#" data-f="owned">Stuff I own</a></li>
        </ul>
        <h4>Sort</h4>
        <ul id="Sorts">
          <li><a href="#" data-s="name">A to Z</a></li>
          <li><a href="#" data-s="low">Cheapest</a></li>
          <li><a href="#" data-s="high">Priciest</a></li>
          <li><a href="#" data-s="year">Oldest first</a></li>
        </ul>
        <h4>Search</h4>
        <input type="search" id="Search" placeholder="Search items" aria-label="Search items">
        <p class="Hint" style="margin-top:12px">Earn <b class="Tix">Tix</b> by logging in daily and playing places. Hats are cool. Collect them all!</p>
      </aside>
      <div style="flex:1;min-width:0">
        <div class="HeaderPager"><span class="Title" id="ListTitle"></span><span class="Label" id="ListCount"></span></div>
        <div class="ItemGrid" id="Items"><div class="Empty">Loading&hellip;</div></div>
        <div id="Pager"></div>
      </div>
    </div>
  </main>
  <div id="FooterSlot"></div>
</div>
<script src="js/common.js"></script>
<script>
(async function () {
  let me = await RB.page("Catalog");
  if (!me) return;
  const data = await RB.items();
  const TYPES = [["hat", "Hats"], ["face", "Faces"], ["head", "Heads"], ["tshirt", "T-Shirts"], ["shirt", "Shirts"], ["pants", "Pants"], ["extra", "Extras"]];
  const PER_PAGE = 30;
  const state = { type: RB.param("type") || "hat", f: "all", s: "name", q: "", page: 1 };
  const $ = (id) => document.getElementById(id);
  const price = (i) => i.price === 0 ? `<span class="Price Free">FREE</span>`
    : i.currency === "robux" ? `<span class="Robux">R$ ${RB.num(i.price)}</span>` : `<span class="Tix">Tix ${RB.num(i.price)}</span>`;
  const pic = (i, big) => i.icon ? `<img src="${i.icon}" alt="" loading="lazy">` : `<span class="Label">No image</span>`;

  $("Tabs").innerHTML = TYPES.map(([t, l]) => `<a href="#" data-t="${t}">${l}</a>`).join("");

  function render() {
    const q = state.q.toLowerCase();
    let list = data.items.filter((i) => i.type === state.type && !i.builtin &&
      (state.f === "all" || (state.f === "free" ? i.price === 0 : state.f === "owned" ? i.owned : i.currency === state.f && i.price > 0)) &&
      (!q || (i.name + " " + i.desc).toLowerCase().includes(q)));
    const sorts = { name: (a, b) => a.name.localeCompare(b.name), low: (a, b) => a.price - b.price || a.name.localeCompare(b.name),
      high: (a, b) => b.price - a.price, year: (a, b) => (a.year || 9999) - (b.year || 9999) || a.name.localeCompare(b.name) };
    list.sort(sorts[state.s]);
    const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
    state.page = Math.min(state.page, pages);
    const shown = list.slice((state.page - 1) * PER_PAGE, state.page * PER_PAGE);
    $("ListTitle").textContent = TYPES.find((t) => t[0] === state.type)[1] + (state.q ? ` matching "${state.q}"` : "");
    $("ListCount").textContent = `${list.length} item${list.length === 1 ? "" : "s"}`;
    $("Items").innerHTML = shown.length ? shown.map((i) => `
      <div class="Item" data-id="${RB.esc(i.id)}">
        <a class="Pic" href="#" data-open>${pic(i)}</a>
        <div class="Name"><a href="#" data-open>${RB.esc(i.name)}</a></div>
        <div>${price(i)}</div>
        <div>${i.owned ? `<span class="Owned">&#10004; Owned</span>` : `<button class="Button Green" data-buy>Buy</button>`}</div>
      </div>`).join("") : `<div class="Empty">Nothing here.</div>`;
    $("Pager").innerHTML = RB.pager(state.page, pages, (p) => `#page${p}`);
    for (const a of document.querySelectorAll("[data-t]")) a.classList.toggle("active", a.dataset.t === state.type);
    for (const a of document.querySelectorAll("[data-f]")) a.classList.toggle("active", a.dataset.f === state.f);
    for (const a of document.querySelectorAll("[data-s]")) a.classList.toggle("active", a.dataset.s === state.s);
  }

  async function buy(item) {
    const cur = item.currency === "robux" ? "ROBUX" : "Tix";
    const have = item.currency === "robux" ? me.robux : me.tix;
    if (item.price > have) { RB.alert(`You need ${RB.num(item.price)} ${cur} to buy ${item.name}, but you only have ${RB.num(have)}. Log in tomorrow or play some places to earn more!`, { title: "Insufficient Funds" }); return; }
    const verb = item.price ? `Would you like to buy ${item.name} for ${RB.num(item.price)} ${cur}?` : `Take ${item.name} for free?`;
    if (!(await RB.confirm(verb, { title: "Buy Item", ok: item.price ? "Buy Now!" : "Take One", cancel: "Cancel" }))) return;
    try {
      await RB.api("catalog/buy", { method: "POST", body: { id: item.id } });
      item.owned = true;
      me = await RB.refreshMe();
      render();
      const go = await RB.confirm(`You bought ${item.name}! Want to wear it now?`, { title: "Purchase Complete", ok: "Go to Avatar", cancel: "Keep Shopping" });
      if (go) location.href = "avatar.html";
    } catch (e) { RB.alert(e.message); }
  }

  function detail(item) {
    RB._modal(`<div class="ItemDetail"><div class="Big">${item.icon ? `<img src="${item.icon}" alt="">` : ""}</div>
      <div style="flex:1;min-width:150px"><h3>${RB.esc(item.name)}</h3>
        <p>${price(item)} ${item.year ? `<span class="Label">&middot; ${item.year}</span>` : ""}</p>
        <p class="Blurb">${item.desc ? RB.rich(item.desc) : "<span class='Label'>No description.</span>"}</p>
        <p class="Label">File: ${RB.esc(item.file)}</p>
        <p>${item.owned ? '<span class="Owned Success">&#10004; You own this</span>' : ""}</p></div></div>`,
      item.name, item.owned ? [["Close", false]] : [["Buy", true], ["Close", false]])
      .then((b) => { if (b) buy(item); });
    document.querySelector(".ModalBox").style.maxWidth = "520px";
  }

  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-t],[data-f],[data-s]");
    if (t) {
      e.preventDefault();
      if (t.dataset.t) { state.type = t.dataset.t; state.page = 1; }
      if (t.dataset.f) { state.f = t.dataset.f; state.page = 1; }
      if (t.dataset.s) state.s = t.dataset.s;
      render();
      return;
    }
    const pg = e.target.closest('#Pager a[href^="#page"]');
    if (pg) { e.preventDefault(); state.page = Number(pg.getAttribute("href").slice(5)); render(); scrollTo(0, 0); return; }
    const card = e.target.closest(".Item");
    if (!card) return;
    const item = data.byId.get(card.dataset.id);
    if (e.target.closest("[data-buy]")) buy(item);
    else if (e.target.closest("[data-open]")) { e.preventDefault(); detail(item); }
  });
  $("Search").addEventListener("input", (e) => { state.q = e.target.value.trim(); state.page = 1; render(); });
  render();
})();
</script>
</body>
</html>
