<!doctype html>
<meta charset="utf-8">
<title>Map Viewer</title>
<style>html,body,#Map{margin:0;width:100%;height:100%;overflow:hidden;background:#9bc7e8}#Help,#Reset{position:fixed;padding:5px 7px;font:11px Verdana}#Help{left:8px;bottom:8px;background:#000a;color:#fff;pointer-events:none}#Reset{right:8px;top:8px;border:1px solid #333;background:#ddd;color:#111}</style>
<div id="Map"></div><div id="Help">Drag: orbit &bull; Wheel: zoom &bull; WASD: fly &bull; Q/E: down/up</div><button id="Reset">Reset camera</button>
<script type="module">
import * as THREE from "/vendor/three/three.module.min.js";

const tex = (d) => { const k=d.startsWith("url:")?d:`data:image/png;base64,${d}`; if(!textures.has(k)) textures.set(k,loader.load(k.replace("url:",""))); return textures.get(k); };
const meshCache=new Map(),meshFor=async url=>{if(!meshCache.has(url))meshCache.set(url,fetch(url).then(r=>r.ok?r.json():null).catch(()=>null));const points=await meshCache.get(url);if(!points)return null;const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(points,3));g.computeVertexNormals();return g};

  const body=(part.name||"").toLowerCase().replace(/\s/g,""),characterMesh=part.clothes?.characterMeshes?.[body],shape=characterMesh?.mesh||part.mesh;let geometry=part.wedge?wedge(part.s):!shape&&bevels++<400?bevelBox(part.s):new THREE.BoxGeometry(...part.s);
  if(shape){const file=shape.file?await meshFor(shape.file):null;if(file){geometry=file;geometry.scale(...shape.scale);geometry.translate(...shape.offset)}else{if(shape.type===3)geometry=new THREE.SphereGeometry(.5,12,8);else if(shape.type===4)geometry=new THREE.CylinderGeometry(.5,.5,1,12);else if(shape.type===2)geometry=wedge([1,1,1]);if(shape.type!==5)geometry.scale(part.s[0]*shape.scale[0],part.s[1]*shape.scale[1],part.s[2]*shape.scale[2]);}}

  for(const skin of skins){const t=tex(skin.data||`url:${skin.url}`);if(skin.tile){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(part.s[0]/skin.tile[0],part.s[1]/skin.tile[1]);}if(material===base)material=Array.from({length:6},()=>base);material[skin.face]=new THREE.MeshLambertMaterial({map:t,transparent:true,flatShading:true});}
  const m=new THREE.Matrix4().set(part.r[0][0],part.r[0][1],part.r[0][2],part.p[0],part.r[1][0],part.r[1][1],part.r[1][2],part.p[1],part.r[2][0],part.r[2][1],part.r[2][2],part.p[2],0,0,0,1), mesh=part.truss?truss(part.s,material):new THREE.Mesh(geometry,material);
  mesh.matrixAutoUpdate=false;mesh.matrix.copy(m);mesh.updateMatrixWorld(true);mesh.userData.baseplate=part.terrain||part.s[0]*part.s[2]>10000&&part.s[1]<5;scene.add(mesh);box.expandByObject(mesh);
  if(part.surface===4&&!part.wedge){const inset=new THREE.Mesh(new THREE.BoxGeometry(part.s[0]*.7,.02,part.s[2]*.7),new THREE.MeshLambertMaterial({color:new THREE.Color(part.c).multiplyScalar(.6)}));inset.position.set(0,part.s[1]/2+.011,0);inset.applyMatrix4(m);scene.add(inset)}
  if(part.stud&&studs<2000&&part.s[0]<16&&part.s[2]<16){for(let x=-part.s[0]/2+.5;x<part.s[0]/2&&studs<2000;x++)for(let z=-part.s[2]/2+.5;z<part.s[2]/2&&studs<2000;z++){const s=new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,.08,8),new THREE.MeshLambertMaterial({color:part.c}));s.position.set(x,part.s[1]/2+.04,z);s.applyMatrix4(m);scene.add(s);studs++;}}
}
const skyScene=new THREE.Scene(),skyCamera=new THREE.PerspectiveCamera(70,1,.1,10),sky=source.sky,X=new THREE.Vector3(1,0,0),Y=new THREE.Vector3(0,1,0),Z=new THREE.Vector3(0,0,1),skyFaces={lf:[Z.clone().negate(),X,Y],bk:[X,Z,Y],rt:[Z,X.clone().negate(),Y],ft:[X.clone().negate(),Z.clone().negate(),Y],up:[Y,X.clone().negate(),Z.clone().negate()],dn:[Y.clone().negate(),X.clone().negate(),Z]};
if(sky)await Promise.all(Object.entries(skyFaces).map(([face,[dir,right,up]])=>new Promise(done=>loader.load(sky[face],t=>{t.colorSpace=THREE.SRGBColorSpace;const plane=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.MeshBasicMaterial({map:t,depthWrite:false}));plane.matrixAutoUpdate=false;plane.matrix.makeBasis(right,up,right.clone().cross(up)).setPosition(dir);plane.updateMatrixWorld(true);skyScene.add(plane);done()},undefined,done))));
box.getCenter(target);const size=box.getSize(new THREE.Vector3()), span=Math.max(size.x,size.y,size.z,20),median=k=>{const a=source.parts.map(p=>p.p[k]).sort((a,b)=>a-b);return a[a.length>>1]||0};target.set(median(0),median(1),median(2));const dists=source.parts.map(p=>target.distanceTo(new THREE.Vector3(...p.p))).sort((a,b)=>a-b);let yaw=.7,pitch=.45,distance=Math.max(dists[Math.floor(dists.length*.55)]||20,20)/Math.tan(Math.PI/6),dragging=false,lastX=0,lastY=0,saved=!!source.view;camera.near=.1;camera.far=span*8;if(saved){const r=source.view.r;camera.matrixAutoUpdate=false;camera.matrix.set(r[0][0],r[0][1],r[0][2],source.view.p[0],r[1][0],r[1][1],r[1][2],source.view.p[1],r[2][0],r[2][1],r[2][2],source.view.p[2],0,0,0,1);camera.matrixWorld.copy(camera.matrix);camera.matrixWorldInverse.copy(camera.matrix).invert();camera.fov=source.view.fov||70;}camera.updateProjectionMatrix();
const wake=()=>{if(!saved)return;const p=new THREE.Vector3(),f=new THREE.Vector3();p.setFromMatrixPosition(camera.matrixWorld);camera.getWorldDirection(f);target.copy(p).addScaledVector(f,distance);const d=f.negate();yaw=Math.atan2(d.x,d.z);pitch=Math.asin(d.y);camera.matrixAutoUpdate=true;saved=false;};
const draw=()=>{if(!saved){const cp=Math.cos(pitch);camera.position.set(target.x+Math.sin(yaw)*cp*distance,target.y+Math.sin(pitch)*distance,target.z+Math.cos(yaw)*cp*distance);camera.lookAt(target);}for(const o of scene.children)if(o.userData.baseplate)o.visible=saved||distance>120;skyCamera.fov=camera.fov;skyCamera.aspect=camera.aspect;skyCamera.updateProjectionMatrix();skyCamera.matrixWorld.extractRotation(camera.matrixWorld);skyCamera.matrixWorldInverse.copy(skyCamera.matrixWorld).invert();renderer.autoClear=false;renderer.clear();renderer.render(skyScene,skyCamera);renderer.clearDepth();renderer.render(scene,camera);};
const resize=()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight);draw();};addEventListener("resize",resize);resize();
