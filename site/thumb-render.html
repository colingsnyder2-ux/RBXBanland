<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<canvas id="c" width="320" height="180"></canvas>
<script type="module">
import * as THREE from "/vendor/three/three.module.min.js";

const p = new URLSearchParams(location.search), id = p.get("id") || "map";
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-12, 12, 6.75, -6.75, .1, 100);
camera.position.set(18, 14, 20); camera.lookAt(0, 2, 0);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(320, 180, false); renderer.outputColorSpace = THREE.SRGBColorSpace;
scene.add(new THREE.HemisphereLight(0xffffff, 0x456078, 1.8));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(-8, 16, 10); scene.add(sun);
const parts = await fetch(`/work/rbxl-scenes/${id}.json`).then((r) => r.json());
const bounds = new THREE.Box3();
let studs = 0;
for (const part of parts) {
  let geometry = new THREE.BoxGeometry(...part.s);
  if (part.mesh) {
    if (part.mesh.type === 0 || part.mesh.type === 3) geometry = new THREE.SphereGeometry(.5, 12, 8);
    else if (part.mesh.type === 4 || part.mesh.type === 5) geometry = new THREE.CylinderGeometry(.5, .5, 1, 12);
    geometry.scale(part.s[0] * part.mesh.scale[0], part.s[1] * part.mesh.scale[1], part.s[2] * part.mesh.scale[2]);
  }
  const material = new THREE.MeshLambertMaterial({ color: part.c, transparent: part.t > 0, opacity: 1 - part.t, flatShading: true });
  const mesh = new THREE.Mesh(geometry, material), m = new THREE.Matrix4();
  m.set(part.r[0][0], part.r[0][1], part.r[0][2], part.p[0], part.r[1][0], part.r[1][1], part.r[1][2], part.p[1], part.r[2][0], part.r[2][1], part.r[2][2], part.p[2], 0, 0, 0, 1);
  mesh.matrixAutoUpdate = false; mesh.matrix.copy(m); mesh.updateMatrixWorld(true); scene.add(mesh); bounds.expandByObject(mesh);
  if (part.stud && studs < 800 && part.s[0] < 16 && part.s[2] < 16 && part.s[1] > .2) {
    for (let x = -part.s[0] / 2 + .5; x < part.s[0] / 2 && studs < 800; x += 1) for (let z = -part.s[2] / 2 + .5; z < part.s[2] / 2 && studs < 800; z += 1) {
      const stud = new THREE.Mesh(new THREE.CylinderGeometry(.11, .11, .08, 8), new THREE.MeshLambertMaterial({ color: part.c }));
      stud.position.set(x, part.s[1] / 2 + .04, z); stud.applyMatrix4(m); scene.add(stud);
      studs++;
    }
  }
}
const center = bounds.getCenter(new THREE.Vector3()), size = bounds.getSize(new THREE.Vector3());
camera.position.set(center.x + size.x * .8, center.y + size.y * .7, center.z + size.z * .9); camera.lookAt(center);
const span = Math.max(size.x, size.z, size.y * 1.4, 12); camera.left = -span / 2; camera.right = span / 2; camera.top = span * .28125; camera.bottom = -span * .28125; camera.far = span * 5; camera.updateProjectionMatrix();
scene.background = new THREE.Color(0x9bc7e8); scene.fog = new THREE.Fog(scene.background, span * 1.5, span * 4);
renderer.render(scene, camera);
</script>
